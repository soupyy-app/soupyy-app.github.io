<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https://apyyrijvmtianbhwrxep.supabase.co; connect-src https://apyyrijvmtianbhwrxep.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Soupyy cookbook</title>
<meta name="description" content="A cookbook shared from Soupyy. Open it in the app to cook along.">
<meta property="og:title" content="A cookbook on Soupyy">
<meta property="og:description" content="Tap to open it in Soupyy.">
<meta property="og:image" content="https://soupyy-app.github.io/card.png">
<meta property="og:type" content="website">
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Source+Sans+3:wght@400;600&display=swap">
<style>
  :root { --bg:#FAF6EC; --surface:#FFFFFF; --surface2:#F3EEE2; --text:#2A211C; --muted:#6B6058; --line:#E8E0D0; --accent:#C2502E; --money:#2E7D32; --moneySoft:#E3F0E3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1612; --surface:#26201B; --surface2:#2F2822; --text:#F3ECE3; --muted:#B5A99E; --line:#3A322B; --accent:#E07A55; --money:#7BC47F; --moneySoft:#22331F; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 "Source Sans 3", system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:0 16px 32px; }
  .brand { display:flex; align-items:center; gap:10px; padding:16px 0; font:600 20px "Fraunces", Georgia, serif; }
  .brand img { width:32px; height:32px; border-radius:8px; }
  .deck { position:relative; padding-bottom:16px; }
  .e1, .e2 { position:absolute; bottom:0; height:40px; border-radius:20px; border:1px solid var(--line); }
  .e1 { left:20px; right:20px; background:var(--line); }
  .e2 { left:10px; right:10px; bottom:8px; background:var(--surface2); }
  .card { position:relative; background:var(--surface); border:1px solid var(--line); border-radius:20px; overflow:hidden; }
  .cover { width:100%; aspect-ratio:16/9; object-fit:cover; display:block; background:var(--surface2); }
  .letter { width:100%; aspect-ratio:16/9; background:var(--surface2); display:flex; align-items:center; justify-content:center; font:600 56px "Fraunces", Georgia, serif; color:var(--muted); }
  .body { padding:14px 18px 16px; }
  h1 { font:600 26px/1.2 "Fraunces", Georgia, serif; margin:0 0 4px; }
  .by { color:var(--muted); font-size:14px; }
  .pill { display:inline-block; font-size:13px; font-weight:600; padding:2px 10px; border-radius:99px; background:var(--moneySoft); color:var(--money); margin-left:6px; }
  ol { margin:16px 0 0; padding-left:22px; color:var(--text); }
  li { margin:4px 0; }
  .note { font-size:14px; color:var(--muted); margin:16px 0 0; }
  .btn { display:block; text-align:center; text-decoration:none; font-weight:600; border-radius:99px; padding:14px; margin-top:12px; }
  .primary { background:var(--accent); color:#fff; }
  .outline { border:1.5px solid var(--line); color:var(--text); background:var(--surface); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="/icon.png" alt="">Soupyy</div>

  <section id="book" class="hidden" aria-live="polite">
    <div class="deck"><div class="e1"></div><div class="e2"></div>
      <div class="card">
        <img id="cover" class="cover hidden" alt="">
        <div id="letter" class="letter hidden" aria-hidden="true"></div>
        <div class="body">
          <h1 id="name"></h1>
          <div class="by"><span id="by"></span><span id="price" class="pill hidden"></span></div>
        </div>
      </div>
    </div>
    <ol id="titles"></ol>
    <p class="note">Recipes open in the Soupyy app.</p>
  </section>

  <section id="missing" class="hidden">
    <h1>Cookbook not found</h1>
    <p class="note">It may not be published any more. You can still find more cookbooks in Soupyy.</p>
  </section>

  <a id="open" class="btn primary" href="https://play.google.com/store/apps/details?id=com.soupyy.app">Open in Soupyy</a>
  <a id="get" class="btn outline" href="https://play.google.com/store/apps/details?id=com.soupyy.app">Get Soupyy on Google Play</a>
</main>
<script>
(function () {
  var API = "https://apyyrijvmtianbhwrxep.supabase.co/rest/v1/rpc/cookbook_card";
  // Publishable key: read-only, and cookbook_card only returns published cookbooks' preview fields.
  var KEY = "sb_publishable_8G43AII5et4DY2VUWt5G2Q_1FkaWPS_";
  var PLAY = "https://play.google.com/store/apps/details?id=com.soupyy.app";
  var id = new URLSearchParams(location.search).get("id") || "";
  var show = function (el) { document.getElementById(el).classList.remove("hidden"); };
  var set = function (el, v) { document.getElementById(el).textContent = v; };

  if (!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(id)) { show("missing"); return; }

  // The page link itself opens the app when it's installed (App Link); "Open" retries that, else Play.
  document.getElementById("open").href = "https://soupyy-app.github.io/c?id=" + id;

  fetch(API, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify({ cid: id }) })
    .then(function (r) { return r.ok ? r.json() : []; })
    .then(function (rows) {
      var b = rows && rows[0];
      if (!b) { show("missing"); return; }
      document.title = b.name + " · Soupyy";
      set("name", b.name);
      set("by", (b.recipes || 0) + " recipes" + (b.handle ? " · by @" + b.handle : ""));
      if (b.price) { set("price", "₹" + b.price); show("price"); }
      var ol = document.getElementById("titles");
      (b.titles || []).forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ol.appendChild(li); });
      if (b.photo && b.photo.indexOf("https://apyyrijvmtianbhwrxep.supabase.co/") === 0) {
        var img = document.getElementById("cover"); img.src = b.photo; img.alt = b.name; show("cover");
      } else { set("letter", (b.name || "?").charAt(0).toUpperCase()); show("letter"); }
      show("book");
    })
    .catch(function () { show("missing"); });
})();
</script>
</body>
</html>
