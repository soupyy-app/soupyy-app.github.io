<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soupyy</title>
<meta name="description" content="Soupyy: cook, share and sell your recipes.">
<meta property="og:title" content="Soupyy">
<meta property="og:image" content="https://soupyy-app.github.io/card.png">
<link rel="icon" href="/icon.png">
<style>
  :root { --bg:#FAF6EC; --text:#2A211C; --muted:#6B6058; --accent:#C2502E; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1B1612; --text:#F3ECE3; --muted:#B5A99E; --accent:#E07A55; } }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:480px; margin:0 auto; padding:48px 16px; text-align:center; }
  img { width:96px; height:96px; border-radius:22px; }
  h1 { font:600 32px Georgia, serif; margin:16px 0 4px; }
  p { color:var(--muted); }
  a { display:inline-block; margin-top:16px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; border-radius:99px; padding:14px 28px; }
</style>
</head>
<body>
<main>
  <img src="/icon.png" alt="Soupyy icon">
  <h1>Soupyy</h1>
  <p>Cook, share and sell your recipes.</p>
  <a href="https://play.google.com/store/apps/details?id=com.soupyy.app">Get Soupyy on Google Play</a>
</main>
</body>
</html>
